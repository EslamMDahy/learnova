name: learnova
description: "Learnova — an LMS platform for instructors and students."
publish_to: "none"

version: 1.0.0+1

environment:
  # Stable channel constraint (3.4+ ships with Dart 3.4, widely available).
  # The previous ^3.9.2 targeted a pre-release SDK and caused flutter pub get
  # failures on CI and developer machines running the stable channel.
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.0

  # State management
  flutter_riverpod: ^2.5.1

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  file_picker: ^10.3.10
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: Lexend
      fonts:
        - asset: assets/fonts/lexend/Lexend-Regular.ttf
        - asset: assets/fonts/lexend/Lexend-Bold.ttf
          weight: 700
